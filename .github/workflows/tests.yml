# Runs the full e2e suite on every PR and push to main, so a broken
# install.sh can never reach the fleet: the suite installs, updates,
# breaks, heals, and uninstalls the real scripts inside a sandboxed
# fake root (see tests/run-e2e.sh).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n install.sh uninstall.sh tests/run-e2e.sh
      - name: End-to-end suite
        run: sudo bash tests/run-e2e.sh
